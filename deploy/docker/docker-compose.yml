services:
  noo-site:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: noo-site:latest
    container_name: noo-site
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
