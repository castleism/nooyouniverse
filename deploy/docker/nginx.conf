worker_processes  auto;
pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Cloudflare Workers static-assets serves .webmanifest as application/manifest+json.
    types {
        application/manifest+json webmanifest;
    }

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    server {
        listen       8080;
        server_name  _;
        root   /usr/share/nginx/html;
        index  index.html;

        # Same security headers as public/_headers (Cloudflare Workers static-assets).
        # nginx's add_header does NOT inherit into a block that sets its own
        # add_header (e.g. the Cache-Control overrides below), so these five
        # lines are repeated in every location that adds a header of its own.
        # Keep this list in sync with public/_headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://nwsqyuucwzihruszocge.supabase.co; font-src 'self'; upgrade-insecure-requests" always;

        # Never serve deploy metadata / dotfiles.
        location ~ (^|/)\.(?!well-known) {
            return 404;
        }
        location = /_headers {
            return 404;
        }
        location = /CNAME {
            return 404;
        }
        location = /.deploy-poke {
            return 404;
        }

        # HTML documents and the service worker / manifest must always revalidate,
        # matching the sw.js network-first design note.
        location ~ \.html$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://nwsqyuucwzihruszocge.supabase.co; font-src 'self'; upgrade-insecure-requests" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location = /sw.js {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://nwsqyuucwzihruszocge.supabase.co; font-src 'self'; upgrade-insecure-requests" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
        location = /manifest.webmanifest {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://nwsqyuucwzihruszocge.supabase.co; font-src 'self'; upgrade-insecure-requests" always;
            add_header Cache-Control "no-cache" always;
            default_type application/manifest+json;
            try_files $uri =404;
        }

        # Long-lived immutable cache for content-addressed static assets.
        location /assets/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://nwsqyuucwzihruszocge.supabase.co; font-src 'self'; upgrade-insecure-requests" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Simple liveness endpoint for the HEALTHCHECK.
        location = /healthz {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://nwsqyuucwzihruszocge.supabase.co; font-src 'self'; upgrade-insecure-requests" always;
            add_header Cache-Control "no-cache" always;
            return 200 "ok\n";
        }

        # Clean URLs: /log -> /log.html, matching the Cloudflare Worker's routing.
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://nwsqyuucwzihruszocge.supabase.co; font-src 'self'; upgrade-insecure-requests" always;
            add_header Cache-Control "no-cache" always;
        }
    }
}
