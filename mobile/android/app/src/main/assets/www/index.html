<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private observation log — Noo YouNiverse</title>
<meta name="description" content="Private, on-device observation notes linked to approved Noo YouNiverse missions. Not medical measurements, not a released product.">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="kicker">Debug prototype · not a store release</div>
    <div class="wordmark">NOO<span class="star"> ✦ </span>YOUNIVERSE</div>
    <h1>Private observation log</h1>
  </header>

  <div class="banner" role="note">
    <strong>Observations, not measurements.</strong>
    Notes stay on this device. This milestone does not read sensors, invent clinical claims, or prescribe anything.
    Educational only — not medical advice. Adults 21+. Cillian is fictional.
  </div>

  <main>
    <section id="panel-missions" class="panel active" data-panel="missions"></section>
    <section id="panel-log" class="panel" data-panel="log"></section>
    <section id="panel-history" class="panel" data-panel="history"></section>
    <section id="panel-transfer" class="panel" data-panel="transfer"></section>
  </main>

  <nav class="tabs" aria-label="Primary">
    <button type="button" data-tab="missions" aria-selected="true">Missions</button>
    <button type="button" data-tab="log" aria-selected="false">Log</button>
    <button type="button" data-tab="history" aria-selected="false">History</button>
    <button type="button" data-tab="transfer" aria-selected="false">Transfer</button>
  </nav>
</div>
<script src="approved-missions.js"></script>
<script src="noo-log.js"></script>
<script src="app.js"></script>
</body>
</html>
