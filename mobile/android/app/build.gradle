plugins {
    id "com.android.application"
}

android {
    namespace "com.nooyouniverse.observationlog"
    compileSdk 34

    defaultConfig {
        applicationId "com.nooyouniverse.observationlog"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "0.2.1"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Use the existing release package identity; signing is a separate local step.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}
